---
layout: default
---
<article class="post">

<p class="post-meta">
{{ page.date | date: "%Y-%m-%d" }}
{% if page.lang == "es" %}<span class="tag">ES</span>{% else %}<span class="tag">EN</span>{% endif %}
{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}
</p>

<h1>{{ page.title }}</h1>

{{ content }}

</article>

<p><a href="/blog/">← All posts</a></p>
